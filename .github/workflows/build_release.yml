name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v2.0.1-test)'
        required: true
        default: 'v2.0.1-test'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud stubs
        run: |
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/stubs/latest.zip" -OutFile "latest.zip"
          Expand-Archive -Path "latest.zip" -DestinationPath "$env:APPDATA\XIVLauncher\addon\Hooks\dev" -Force
        shell: pwsh

      - name: Restore dependencies
        run: dotnet restore TargetLines.sln

      - name: Build Release
        run: dotnet build TargetLines.sln --configuration Release --no-restore

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: TargetLines/bin/x64/Release/TargetLines/latest.zip
          generate_release_notes: true
          prerelease: ${{ github.ref_name != 'master' }}
